name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the LogB APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # versionCode must increase monotonically: 1.2.3 -> 10203, 0.5.0 -> 500
          echo "code=$(echo "$version" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the runner's JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same variable names the build reads on the developer's machine; the keystore itself
      # travels as one base64 secret.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOGB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/logb.jks"
            echo "path=$RUNNER_TEMP/logb.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No LOGB_KEYSTORE_BASE64 secret; the APK will carry the debug signature." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          ANDROID_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.LOGB_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.LOGB_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.LOGB_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --console=plain
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/LogB-release.apk "LogB-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LogB ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: LogB-${{ steps.version.outputs.name }}.apk
